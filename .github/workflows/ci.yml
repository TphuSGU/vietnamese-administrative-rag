name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Manual trigger

jobs:
  # ============================================================================
  # Backend Tests
  # ============================================================================
  backend-tests:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    continue-on-error: true  # Continue even if this job fails
    
    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false  # Run all matrix jobs even if one fails
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'local-government-ai-assistant/backend/requirements.txt'
      
      - name: Install dependencies
        continue-on-error: true
        run: |
          cd local-government-ai-assistant/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt || {
            echo "::error::Failed to install dependencies"
            pip install -r requirements.txt -v 2>&1 | tee install-errors.log
            exit 1
          }
      
      - name: Run linting (flake8)
        continue-on-error: true  # Continue even if linting fails
        run: |
          cd local-government-ai-assistant/backend
          pip install flake8
          mkdir -p test-results
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics 2>&1 | tee test-results/flake8-errors.log || true
          flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics 2>&1 | tee -a test-results/flake8-errors.log || true
      
      - name: Run unit tests
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/local-government-ai-assistant/backend
        run: |
          cd local-government-ai-assistant/backend
          mkdir -p test-results
          pytest tests/unit/ -v --tb=short --maxfail=999 \
            --continue-on-collection-errors \
            -o log_cli=true \
            -o log_cli_level=DEBUG \
            --junitxml=test-results/unit-tests.xml \
            2>&1 | tee test-results/unit-tests.log || true
      
      - name: Run integration tests
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/local-government-ai-assistant/backend
        run: |
          cd local-government-ai-assistant/backend
          mkdir -p test-results
          pytest tests/integration/ -v --tb=short --maxfail=999 \
            --continue-on-collection-errors \
            -o log_cli=true \
            -o log_cli_level=DEBUG \
            --junitxml=test-results/integration-tests.xml \
            2>&1 | tee test-results/integration-tests.log || true
      
      - name: Run property tests
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/local-government-ai-assistant/backend
        run: |
          cd local-government-ai-assistant/backend
          mkdir -p test-results
          pytest tests/property/ -v --tb=short --maxfail=999 \
            --continue-on-collection-errors \
            -o log_cli=true \
            -o log_cli_level=DEBUG \
            --junitxml=test-results/property-tests.xml \
            2>&1 | tee test-results/property-tests.log || true
      
      - name: Generate test coverage
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/local-government-ai-assistant/backend
        run: |
          cd local-government-ai-assistant/backend
          pip install pytest-cov
          mkdir -p test-results
          pytest tests/ --cov=app --cov-report=xml --cov-report=html \
            --maxfail=999 --continue-on-collection-errors \
            2>&1 | tee test-results/coverage.log || true
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()  # Upload even if tests fail
        with:
          name: backend-test-results-py${{ matrix.python-version }}
          path: |
            local-government-ai-assistant/backend/test-results/
            local-government-ai-assistant/backend/htmlcov/
            local-government-ai-assistant/backend/*-errors.log
          retention-days: 30
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          file: ./local-government-ai-assistant/backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
      
      - name: Summarize test results
        if: always()
        run: |
          cd local-government-ai-assistant/backend
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f test-results/unit-tests.xml ]; then
            echo "### Unit Tests" >> $GITHUB_STEP_SUMMARY
            python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('test-results/unit-tests.xml')
          root = tree.getroot()
          tests = root.attrib.get('tests', '0')
          failures = root.attrib.get('failures', '0')
          errors = root.attrib.get('errors', '0')
          print(f'- Total: {tests}')
          print(f'- Failures: {failures}')
          print(f'- Errors: {errors}')
          " >> $GITHUB_STEP_SUMMARY || echo "- Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Logs" >> $GITHUB_STEP_SUMMARY
          echo "- See artifacts for detailed logs" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Frontend Tests
  # ============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate HTML
        continue-on-error: true
        run: |
          cd local-government-ai-assistant/frontend
          npm install -g html-validate
          html-validate *.html 2>&1 | tee html-validate.log || true
      
      - name: Check JavaScript syntax
        continue-on-error: true
        run: |
          cd local-government-ai-assistant/frontend
          npm install -g eslint
          npx eslint *.js --no-eslintrc --env browser,es2021 2>&1 | tee eslint.log || true
      
      - name: Upload frontend results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: frontend-test-results
          path: |
            local-government-ai-assistant/frontend/*.log
          retention-days: 30

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Run Bandit (Python security)
        continue-on-error: true
        run: |
          pip install bandit
          cd local-government-ai-assistant/backend
          mkdir -p test-results
          bandit -r app/ -f json -o test-results/bandit-report.json 2>&1 | tee test-results/bandit.log || true
          bandit -r app/ -f txt 2>&1 | tee -a test-results/bandit.log || true
      
      - name: Run Safety (dependency check)
        continue-on-error: true
        run: |
          pip install safety
          cd local-government-ai-assistant/backend
          mkdir -p test-results
          safety check --json --output test-results/safety-report.json 2>&1 | tee test-results/safety.log || true
          safety check 2>&1 | tee -a test-results/safety.log || true
      
      - name: Upload security results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-results
          path: |
            local-government-ai-assistant/backend/test-results/bandit-report.json
            local-government-ai-assistant/backend/test-results/bandit.log
            local-government-ai-assistant/backend/test-results/safety-report.json
            local-government-ai-assistant/backend/test-results/safety.log
          retention-days: 30

  # ============================================================================
  # Summary Report
  # ============================================================================
  summary:
    name: Generate Summary Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan]
    if: always()  # Run even if previous jobs fail
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        continue-on-error: true
      
      - name: Generate summary report
        run: |
          echo "# CI Pipeline Summary" > summary.md
          echo "" >> summary.md
          echo "## Job Status" >> summary.md
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> summary.md
          echo "- Frontend Tests: ${{ needs.frontend-tests.result }}" >> summary.md
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> summary.md
          echo "" >> summary.md
          echo "## Artifacts" >> summary.md
          echo "All test results, logs, and reports are available in artifacts." >> summary.md
          echo "" >> summary.md
          echo "## Next Steps" >> summary.md
          echo "1. Review test logs in artifacts" >> summary.md
          echo "2. Fix failing tests" >> summary.md
          echo "3. Review security scan results" >> summary.md
          
          cat summary.md >> $GITHUB_STEP_SUMMARY
      
      - name: Upload summary
        uses: actions/upload-artifact@v3
        with:
          name: ci-summary
          path: summary.md
          retention-days: 90
