[pytest]
# Pytest configuration for RAG LLM Core System

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end workflows
    property: Property-based tests using Hypothesis
    slow: Tests that take significant time to run
    requires_model: Tests that require loading ML models
    requires_api: Tests that require external API access

# Asyncio configuration
asyncio_mode = auto

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Coverage options (if using pytest-cov)
# --cov=app
# --cov-report=html
# --cov-report=term-missing

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (requires pytest-timeout)
# timeout = 300

# Hypothesis profile for property-based testing
[hypothesis]
max_examples = 100
deadline = None
